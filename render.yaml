services:
  - type: web
    name: swayam-portfolio
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn swayam_portfolio.wsgi"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: swayam-portfolio-db # This is for Render Managed DB, but for Supabase we manually set it in dashboard
          property: connectionString
