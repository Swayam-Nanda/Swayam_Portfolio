    <script>
      // Intercept remote CMS requests to load local achievements JSON
      (function() {
        const originalFetch = window.fetch;
        window.fetch = function(input, options) {
          const urlStr = typeof input === 'string' ? input : (input && input.url);
          if (typeof urlStr === 'string' && (urlStr.includes('projects-dev.json') || urlStr.includes('projects-latest.json'))) {
            console.log('Intercepted CMS projects fetch, loading local assets/data/projects.json');
            return originalFetch('assets/data/projects.json?v=' + Date.now(), options);
          }
          return originalFetch(input, options);
        };
      })();

      !(function () {
        window._ENV_ = "production";
        window._CMS_ = "%CMS%";
        window._UNSUPPORTED_PAGE_ = "unsupported.html";
        window.HYDRA_BASE_PATH = "/achievements/";
        window.HYDRA_ASSETS_BASE_PATH = "";
        try {
          eval("let obj = {}; obj?.prop");
        } catch (e) {
          window.location.replace(window._UNSUPPORTED_PAGE_);
          return;
        }
        ((window._CACHE_ = "1746999829744"),
          (window.UIL_STATIC_PATH = "assets/data/uil.1746999829744.json"));

        // Theme Syncing Code
        const THEMES = {
          blue: { primary: "#5eb8ff", dark: "#1a90ad", highlight: "#93e5ff", light: "#ffffff" },
          gold: { primary: "#f4c46b", dark: "#d4a44b", highlight: "#fff3ad", light: "#ffffff" },
          white: { primary: "#f5f5f5", dark: "#a0a0a0", highlight: "#ffffff", light: "#ffffff" },
          crimson: { primary: "#ff5a5a", dark: "#b52a2a", highlight: "#ff9b9b", light: "#ffffff" },
          emerald: { primary: "#5ee3a8", dark: "#2a9060", highlight: "#b2ffdb", light: "#ffffff" },
          purple: { primary: "#b07bff", dark: "#7040b0", highlight: "#e1ccff", light: "#ffffff" },
        };
        const getQueryParam = (name) => {
          const match = RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
          return match ? decodeURIComponent(match[1].replace(/\+/g, ' ')) : null;
        };
        const queryTheme = getQueryParam("theme");
        if (queryTheme && THEMES[queryTheme]) {
          localStorage.setItem("portfolio-theme", queryTheme);
        }
        const activeTheme = localStorage.getItem("portfolio-theme") || "blue";
        window.ACTIVE_THEME_COLORS = THEMES[activeTheme] || THEMES.blue;

        // Reload page if theme changes in another tab
        window.addEventListener("storage", (e) => {
          if (e.key === "portfolio-theme") {
            window.location.reload();
          }
        });

        var h = document.head,
          mods = [
            "01_module",
            "02_module",
            "03_module",
            "04_module",
            "05_module",
            "06_module",
            "07_module",
            "08_module",
            "09_module",
            "10_module",
            "11_module",
          ];
        for (var i = 0; i < mods.length; i++) {
          var s = "assets/js/modules/" + mods[i] + ".js?v=" + window._CACHE_,
            e = document.createElement("link");
          ((e.href = s),
            (e.rel = "preload"),
            (e.as = "script"),
            h.appendChild(e));
          var c = document.createElement("script");
          ((c.src = s), (c.async = !1), h.appendChild(c));
        }
      })();
